name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ffmpeg (含 libass 才能燒字幕)
        run: |
          # brew 的 ffmpeg 常沒編 libass（無 subtitles 濾鏡）→ 燒字幕的 assemble 測試會炸。
          # 若 brew 版沒 libass，補一顆 evermeet 靜態版到 ~/.local/bin —— ffmpeg_bin() 的候選
          # 路徑，它會優先挑「有 subtitles 濾鏡」那顆。ffprobe 不需 libass，用 brew 的即可。
          brew install ffmpeg
          echo "=== 診斷：which ffmpeg / brew 版有無 subtitles 濾鏡 ==="
          which ffmpeg || true
          ffmpeg -hide_banner -filters 2>/dev/null | grep -i subtitles || echo "brew ffmpeg 無 subtitles 濾鏡"
          if ! ffmpeg -hide_banner -filters 2>/dev/null | grep -qi subtitles; then
            echo "=== brew 版無 libass，補裝 evermeet 靜態 ffmpeg ==="
            softwareupdate --install-rosetta --agree-to-license 2>/dev/null || true
            mkdir -p ~/.local/bin
            curl -fsSL https://evermeet.cx/ffmpeg/getrelease/zip -o /tmp/ffmpeg.zip
            unzip -o /tmp/ffmpeg.zip -d ~/.local/bin
            chmod +x ~/.local/bin/ffmpeg
            ~/.local/bin/ffmpeg -hide_banner -filters 2>/dev/null | grep -i subtitles || echo "evermeet 仍無 subtitles 濾鏡"
          fi
          # 最終把關：至少一個 ffmpeg_bin() 候選含 subtitles 濾鏡，否則明確 fail 在此（而非 27 個測試）
          python3 -c "import shutil,subprocess; from pathlib import Path; c=[shutil.which('ffmpeg'),str(Path.home()/'.local/bin/ffmpeg'),'/opt/homebrew/bin/ffmpeg','/usr/local/bin/ffmpeg']; ok=[x for x in c if x and Path(x).exists() and 'Filter subtitles' in subprocess.run([x,'-hide_banner','-h','filter=subtitles'],capture_output=True,text=True).stdout]; print('含 libass 的 ffmpeg:',ok); exit(0 if ok else 1)"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check podcast_toolkit tests
      - name: Pytest
        run: pytest tests/ -q

  # CDP 走查：scripts/cdp-walkthrough/ 的瀏覽器護欄（指紋／版面／互動）。以前只跑在本機，
  # CI 一條都跑不到（TODO.md 2026-09-26 記的缺口）。run_walkthroughs.py 會自己建沙盒集、
  # 用全新 profile 起 headless Chrome、依序跑完再收攤，紅了回非零 exit。
  # 刻意獨立成一個 job（不進 test matrix）：它要真瀏覽器、跑得慢，且與 pytest 互不相干；
  # 壞了要一眼看出是「瀏覽器護欄紅」還是「單元測試紅」。
  cdp-walkthrough:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg (走查只需抽音軌，不需 libass)
        run: |
          # 走查的沙盒集只拿 ffmpeg 把 sample-video.mp4 抽成 wav 餵 /api/waveform，
          # 用不到 subtitles 濾鏡 → 直接抓 evermeet 靜態版（比 brew install ffmpeg 快很多）。
          mkdir -p ~/.local/bin
          curl -fsSL https://evermeet.cx/ffmpeg/getrelease/zip -o /tmp/ffmpeg.zip
          unzip -o /tmp/ffmpeg.zip -d ~/.local/bin
          chmod +x ~/.local/bin/ffmpeg
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ~/.local/bin/ffmpeg -version | head -1
      - name: 確認有 Chrome（macos runner 預裝；沒有就自己裝）
        run: |
          APP="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          if [ ! -x "$APP" ]; then
            echo "runner 沒有預裝 Chrome，改用 brew 裝"
            brew install --cask google-chrome
          fi
          "$APP" --version
      - name: Install package
        run: pip install -e ".[dev,cdp]"
      - name: CDP 走查
        run: python -u scripts/cdp-walkthrough/run_walkthroughs.py
      - name: 收走查結果（紅了要看得到 got/want）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdp-walkthrough-results
          path: scripts/cdp-walkthrough/timeline-baseline/*_result.json
          if-no-files-found: warn
